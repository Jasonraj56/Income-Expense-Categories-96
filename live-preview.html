<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinTrack | Income, Expenses & Categories (Live Preview)</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --border-focus: #818cf8;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-full: 9999px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
    }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; }

    /* Layout */
    .app-layout { min-height: 100vh; display: flex; flex-direction: column; }
    .main-content {
      flex: 1; max-width: 1280px; width: 100%; margin: 0 auto;
      padding: 24px 20px 48px; display: flex; flex-direction: column; gap: 24px;
    }

    /* Navbar */
    .navbar {
      position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .navbar-container {
      max-width: 1280px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      font-size: 26px; width: 44px; height: 44px; background: var(--primary-light);
      border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center;
    }
    .brand-text h1 { font-size: 20px; font-weight: 800; color: var(--text-main); }
    .brand-sub { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    .navbar-actions { display: flex; align-items: center; gap: 10px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px;
      font-weight: 600; padding: 9px 16px; border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-income { background: #10b981; color: #fff; }
    .btn-income:hover { background: #059669; }
    .btn-expense { background: #ef4444; color: #fff; }
    .btn-expense:hover { background: #dc2626; }
    .btn-block { width: 100%; }

    /* Stat Cards */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px;
    }
    .stat-card {
      background: var(--bg-card); padding: 22px; border-radius: var(--radius-lg);
      border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 10px; transition: var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .stat-header { display: flex; justify-content: space-between; align-items: center; }
    .stat-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .stat-value { font-size: 26px; font-weight: 800; }
    .stat-badge { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .balance-card.positive { border-left: 5px solid #10b981; }
    .balance-card.negative { border-left: 5px solid #ef4444; }
    .income-card { border-left: 5px solid #10b981; }
    .expense-card { border-left: 5px solid #ef4444; }
    .savings-card { border-left: 5px solid #8b5cf6; }
    .text-income { color: #10b981; }
    .text-expense { color: #ef4444; }
    .text-purple { color: #8b5cf6; }

    /* Analytics Grid */
    .analytics-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 20px;
    }
    .analytics-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 20px;
    }
    .card-header-chart { display: flex; justify-content: space-between; align-items: flex-start; }
    .card-header-chart h3 { font-size: 16px; font-weight: 700; }
    .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .badge-tag { font-size: 12px; font-weight: 700; padding: 4px 10px; background: #f1f5f9; border-radius: var(--radius-full); }
    .donut-and-legend { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
    .donut-wrapper { position: relative; width: 140px; height: 140px; margin: 0 auto; flex-shrink: 0; }
    .donut-chart { width: 100%; height: 100%; transform: rotate(-90deg); border-radius: 50%; }
    .donut-center-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .donut-center-amount { font-size: 18px; font-weight: 800; display: block; }
    .donut-center-label { font-size: 10.5px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .chart-legend-list { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 180px; }
    .legend-item { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
    .legend-left { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-name { font-weight: 600; }
    .legend-right { display: flex; align-items: center; gap: 8px; }
    .legend-amount { font-weight: 700; }
    .legend-percent { font-size: 11px; color: var(--text-muted); }

    /* Bar Chart */
    .bar-comparison-container {
      display: flex; justify-content: space-around; align-items: flex-end; height: 150px; padding-top: 10px; gap: 24px;
    }
    .bar-col { display: flex; flex-direction: column; align-items: center; width: 90px; height: 100%; justify-content: flex-end; gap: 8px; }
    .bar-track { width: 100%; flex: 1; display: flex; align-items: flex-end; background: #f1f5f9; border-radius: var(--radius-sm); padding: 3px; }
    .bar-fill { width: 100%; border-radius: var(--radius-sm); transition: height 0.4s ease; min-height: 8px; }
    .bar-fill-income { background: linear-gradient(180deg, #34d399 0%, #10b981 100%); }
    .bar-fill-expense { background: linear-gradient(180deg, #f87171 0%, #ef4444 100%); }
    .bar-label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .bar-val { font-size: 13.5px; font-weight: 800; }

    /* Category Budgets */
    .budget-container {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm);
    }
    .budget-cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px;
    }
    .budget-card {
      background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-md);
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    .budget-card-header { display: flex; justify-content: space-between; align-items: center; }
    .budget-title-info { display: flex; align-items: center; gap: 10px; }
    .cat-icon-lg { font-size: 22px; }
    .cat-title { font-size: 13.5px; font-weight: 700; }
    .cat-limit-sub { font-size: 11px; color: var(--text-muted); }
    .budget-percent-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: var(--radius-full); }
    .status-safe { background: #ecfdf5; color: #059669; }
    .status-warning { background: #fffbeb; color: #d97706; }
    .status-danger { background: #fef2f2; color: #dc2626; }
    .progress-bar-bg { height: 8px; background: #e2e8f0; border-radius: var(--radius-full); overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: var(--radius-full); }
    .budget-card-footer { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); }

    /* Transactions Card & Table */
    .transactions-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
    }
    .transactions-toolbar {
      padding: 16px 20px; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .filter-tabs { display: flex; background: #f1f5f9; border-radius: var(--radius-sm); padding: 3px; gap: 3px; }
    .filter-btn {
      font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 6px;
      color: var(--text-muted); transition: var(--transition);
    }
    .filter-btn.active { background: #ffffff; color: var(--primary); box-shadow: var(--shadow-sm); }
    .search-and-select { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .filter-select {
      padding: 7px 12px; font-size: 13px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); background: #ffffff;
    }
    .search-input {
      padding: 7px 14px; font-size: 13px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); width: 220px; outline: none;
    }
    .search-input:focus { border-color: var(--border-focus); }
    .table-responsive { width: 100%; overflow-x: auto; }
    .custom-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    .custom-table th {
      background: #f8fafc; padding: 12px 18px; font-size: 11.5px; font-weight: 700;
      text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border-color);
    }
    .custom-table td { padding: 14px 18px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
    .custom-table tr:hover td { background: #f8fafc; }
    .cat-badge-table {
      display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 700;
      padding: 3px 10px; border-radius: var(--radius-full); border: 1px solid;
    }
    .method-pill { font-size: 11.5px; background: #f1f5f9; padding: 3px 8px; border-radius: 6px; color: var(--text-muted); }
    .amount-cell { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .row-delete-btn { font-size: 15px; opacity: 0.4; transition: opacity 0.2s; }
    .row-delete-btn:hover { opacity: 1; }

    /* Modals */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-content {
      background: #fff; border-radius: var(--radius-lg); max-width: 520px; width: 100%;
      max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg);
    }
    .modal-lg { max-width: 760px; }
    .modal-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 18px; font-weight: 800; }
    .modal-close-btn { font-size: 22px; color: var(--text-muted); }
    .modal-form { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12.5px; font-weight: 700; color: var(--text-main); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 9px 12px; font-size: 13.5px; border: 1px solid var(--border-color);
      border-radius: var(--radius-sm); outline: none;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .type-toggle-container { display: flex; background: #f1f5f9; border-radius: var(--radius-sm); padding: 4px; gap: 4px; }
    .type-toggle-btn { flex: 1; padding: 8px; font-size: 13px; font-weight: 700; border-radius: 6px; color: var(--text-muted); }
    .type-toggle-btn.active-income { background: #10b981; color: #fff; }
    .type-toggle-btn.active-expense { background: #ef4444; color: #fff; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

    /* Category modal grid */
    .category-manager-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; padding: 24px; }
    .category-scroll-list { max-height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .category-item-card {
      display: flex; justify-content: space-between; align-items: center; padding: 10px;
      background: #f8fafc; border: 1px solid var(--border-color); border-radius: var(--radius-sm);
    }
    .cat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-full); border: 1px solid; font-size: 12px; font-weight: 700; }
    .budget-tag { font-size: 11px; font-weight: 600; color: var(--text-muted); }

    /* Footer */
    .footer { margin-top: auto; border-top: 1px solid var(--border-color); padding: 20px; text-align: center; font-size: 12.5px; color: var(--text-muted); background: #fff; }
    .tech-badge-row { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .tech-badge-row span { font-size: 11px; font-weight: 700; background: #f1f5f9; padding: 2px 10px; border-radius: var(--radius-full); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_CATEGORIES = [
      { _id: 'cat-1', name: 'Salary', type: 'income', color: '#10b981', icon: '💼', budgetLimit: 0 },
      { _id: 'cat-2', name: 'Freelance & Gigs', type: 'income', color: '#06b6d4', icon: '💻', budgetLimit: 0 },
      { _id: 'cat-3', name: 'Investments', type: 'income', color: '#3b82f6', icon: '📈', budgetLimit: 0 },
      { _id: 'cat-4', name: 'Housing & Rent', type: 'expense', color: '#ef4444', icon: '🏢', budgetLimit: 18000 },
      { _id: 'cat-5', name: 'Groceries & Food', type: 'expense', color: '#f59e0b', icon: '🛒', budgetLimit: 8000 },
      { _id: 'cat-6', name: 'Dining & Cafes', type: 'expense', color: '#f97316', icon: '🍔', budgetLimit: 3500 },
      { _id: 'cat-7', name: 'Utilities & Bills', type: 'expense', color: '#6366f1', icon: '⚡', budgetLimit: 3000 },
      { _id: 'cat-8', name: 'Transportation', type: 'expense', color: '#14b8a6', icon: '🚗', budgetLimit: 2500 },
      { _id: 'cat-9', name: 'Entertainment', type: 'expense', color: '#a855f7', icon: '🎬', budgetLimit: 2000 }
    ];

    const INITIAL_TRANSACTIONS = [
      {
        _id: 'tx-1',
        title: 'Monthly Software Developer Salary',
        amount: 65000,
        type: 'income',
        category: 'Salary',
        categoryColor: '#10b981',
        paymentMethod: 'Bank Transfer',
        notes: 'Monthly direct deposit',
        date: new Date(Date.now() - 10 * 86400000).toISOString()
      },
      {
        _id: 'tx-2',
        title: 'Freelance UI/UX Dashboard',
        amount: 18500,
        type: 'income',
        category: 'Freelance & Gigs',
        categoryColor: '#06b6d4',
        paymentMethod: 'UPI / Online',
        notes: 'Client milestone bonus',
        date: new Date(Date.now() - 6 * 86400000).toISOString()
      },
      {
        _id: 'tx-3',
        title: 'Apartment Monthly Rent',
        amount: 15000,
        type: 'expense',
        category: 'Housing & Rent',
        categoryColor: '#ef4444',
        paymentMethod: 'Bank Transfer',
        notes: 'Paid to landlord',
        date: new Date(Date.now() - 8 * 86400000).toISOString()
      },
      {
        _id: 'tx-4',
        title: 'Supermarket Grocery Haul',
        amount: 5450,
        type: 'expense',
        category: 'Groceries & Food',
        categoryColor: '#f59e0b',
        paymentMethod: 'Credit Card',
        notes: 'Vegetables and dairy',
        date: new Date(Date.now() - 4 * 86400000).toISOString()
      },
      {
        _id: 'tx-5',
        title: 'Broadband Wifi & Power Bill',
        amount: 2350,
        type: 'expense',
        category: 'Utilities & Bills',
        categoryColor: '#6366f1',
        paymentMethod: 'UPI / Online',
        notes: 'Monthly recurring utility',
        date: new Date(Date.now() - 3 * 86400000).toISOString()
      },
      {
        _id: 'tx-6',
        title: 'Weekend Dinner Outing',
        amount: 1850,
        type: 'expense',
        category: 'Dining & Cafes',
        categoryColor: '#f97316',
        paymentMethod: 'Debit Card',
        notes: 'Dinner with college friends',
        date: new Date(Date.now() - 1 * 86400000).toISOString()
      }
    ];

    function App() {
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem('demo_categories_inr');
        return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
      });

      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('demo_transactions_inr');
        return saved ? JSON.parse(saved) : INITIAL_TRANSACTIONS;
      });

      const [filterType, setFilterType] = useState('all');
      const [filterCategory, setFilterCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [txModalType, setTxModalType] = useState('expense');
      const [isCatModalOpen, setIsCatModalOpen] = useState(false);

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('demo_categories_inr', JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem('demo_transactions_inr', JSON.stringify(transactions));
      }, [transactions]);

      // Metrics
      const summary = useMemo(() => {
        let totalIncome = 0;
        let totalExpense = 0;
        transactions.forEach((tx) => {
          if (tx.type === 'income') totalIncome += Number(tx.amount);
          else totalExpense += Number(tx.amount);
        });
        const netBalance = totalIncome - totalExpense;
        const savingsRate = totalIncome > 0 ? Math.round((netBalance / totalIncome) * 100) : 0;
        return { totalIncome, totalExpense, netBalance, savingsRate: Math.max(0, savingsRate) };
      }, [transactions]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter((tx) => {
          if (filterType !== 'all' && tx.type !== filterType) return false;
          if (filterCategory !== 'all' && tx.category !== filterCategory) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            return tx.title.toLowerCase().includes(q) || (tx.notes && tx.notes.toLowerCase().includes(q));
          }
          return true;
        });
      }, [transactions, filterType, filterCategory, searchQuery]);

      // Add Transaction
      const handleAddTx = (txData) => {
        const newTx = { ...txData, _id: 'tx-' + Date.now() };
        setTransactions([newTx, ...transactions]);
      };

      // Delete Transaction
      const handleDeleteTx = (id) => {
        if (confirm('Delete this transaction?')) {
          setTransactions(transactions.filter(t => t._id !== id));
        }
      };

      // Add Category
      const handleAddCategory = (catData) => {
        const newCat = { ...catData, _id: 'cat-' + Date.now() };
        setCategories([...categories, newCat]);
      };

      // Delete Category
      const handleDeleteCategory = (id) => {
        if (confirm('Delete this category?')) {
          setCategories(categories.filter(c => c._id !== id));
        }
      };

      return (
        <div className="app-layout">
          {/* Header */}
          <header className="navbar">
            <div className="navbar-container">
              <div className="brand">
                <div className="brand-icon">💰</div>
                <div className="brand-text">
                  <h1>FinTrack</h1>
                  <span className="brand-sub">Income, Expenses & Category System</span>
                </div>
              </div>
              <div className="navbar-actions">
                <button className="btn btn-secondary" onClick={() => setIsCatModalOpen(true)}>
                  <span>🏷️</span> Categories
                </button>
                <button className="btn btn-income" onClick={() => { setTxModalType('income'); setIsTxModalOpen(true); }}>
                  <span>+</span> Add Income
                </button>
                <button className="btn btn-expense" onClick={() => { setTxModalType('expense'); setIsTxModalOpen(true); }}>
                  <span>−</span> Add Expense
                </button>
              </div>
            </div>
          </header>

          <main className="main-content">
            {/* Stat Cards */}
            <div className="stats-grid">
              <div className={`stat-card balance-card ${summary.netBalance >= 0 ? 'positive' : 'negative'}`}>
                <div className="stat-header">
                  <span className="stat-title">Net Balance</span>
                  <span>{summary.netBalance >= 0 ? '🏦' : '⚠️'}</span>
                </div>
                <div className="stat-value">₹{summary.netBalance.toLocaleString('en-IN')}</div>
                <div className="stat-badge">{summary.netBalance >= 0 ? '✓ Profitable Surplus' : '! Deficit'}</div>
              </div>

              <div className="stat-card income-card">
                <div className="stat-header">
                  <span className="stat-title">Total Income</span>
                  <span>📈</span>
                </div>
                <div className="stat-value text-income">+₹{summary.totalIncome.toLocaleString('en-IN')}</div>
                <div className="stat-badge text-income">Incoming Cashflow</div>
              </div>

              <div className="stat-card expense-card">
                <div className="stat-header">
                  <span className="stat-title">Total Expenses</span>
                  <span>📉</span>
                </div>
                <div className="stat-value text-expense">-₹{summary.totalExpense.toLocaleString('en-IN')}</div>
                <div className="stat-badge text-expense">Total Expenditures</div>
              </div>

              <div className="stat-card savings-card">
                <div className="stat-header">
                  <span className="stat-title">Savings Rate</span>
                  <span>🎯</span>
                </div>
                <div className="stat-value text-purple">{summary.savingsRate}%</div>
                <div className="stat-badge">Healthy Target: 20%+</div>
              </div>
            </div>

            {/* Visual Analytics */}
            <AnalyticsSection transactions={transactions} categories={categories} summary={summary} />

            {/* Budget Overview */}
            <BudgetSection categories={categories} transactions={transactions} />

            {/* Transactions Table */}
            <div className="transactions-card">
              <div className="transactions-toolbar">
                <div className="filter-tabs">
                  <button className={`filter-btn ${filterType === 'all' ? 'active' : ''}`} onClick={() => setFilterType('all')}>All</button>
                  <button className={`filter-btn ${filterType === 'income' ? 'active' : ''}`} onClick={() => setFilterType('income')}>Income</button>
                  <button className={`filter-btn ${filterType === 'expense' ? 'active' : ''}`} onClick={() => setFilterType('expense')}>Expenses</button>
                </div>

                <div className="search-and-select">
                  <select className="filter-select" value={filterCategory} onChange={(e) => setFilterCategory(e.target.value)}>
                    <option value="all">All Categories</option>
                    {categories.map(c => <option key={c._id} value={c.name}>{c.icon} {c.name}</option>)}
                  </select>
                  <input
                    type="text"
                    className="search-input"
                    placeholder="Search transactions..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>
              </div>

              <div className="table-responsive">
                <table className="custom-table">
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Title / Description</th>
                      <th>Category</th>
                      <th>Payment Method</th>
                      <th className="text-right">Amount</th>
                      <th className="text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredTransactions.map((tx) => (
                      <tr key={tx._id}>
                        <td>{new Date(tx.date).toLocaleDateString()}</td>
                        <td>
                          <strong>{tx.title}</strong>
                          {tx.notes && <div style={{ fontSize: '11px', color: '#64748b' }}>{tx.notes}</div>}
                        </td>
                        <td>
                          <span className="cat-badge-table" style={{ backgroundColor: `${tx.categoryColor || '#6366f1'}15`, color: tx.categoryColor || '#6366f1', borderColor: `${tx.categoryColor || '#6366f1'}40` }}>
                            {tx.category}
                          </span>
                        </td>
                        <td><span className="method-pill">{tx.paymentMethod}</span></td>
                        <td className={`amount-cell text-right ${tx.type === 'income' ? 'text-income' : 'text-expense'}`}>
                          {tx.type === 'income' ? `+₹${tx.amount.toLocaleString('en-IN')}` : `-₹${tx.amount.toLocaleString('en-IN')}`}
                        </td>
                        <td className="text-center">
                          <button className="row-delete-btn" onClick={() => handleDeleteTx(tx._id)}>🗑️</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Modal: Add Transaction */}
          {isTxModalOpen && (
            <TransactionModal
              onClose={() => setIsTxModalOpen(false)}
              onSubmit={handleAddTx}
              defaultType={txModalType}
              categories={categories}
            />
          )}

          {/* Modal: Category Manager */}
          {isCatModalOpen && (
            <CategoryModal
              categories={categories}
              onClose={() => setIsCatModalOpen(false)}
              onAddCategory={handleAddCategory}
              onDeleteCategory={handleDeleteCategory}
            />
          )}

          <footer className="footer">
            <p>FinTrack &copy; Web Technology Project — Semester 5</p>
            <div className="tech-badge-row">
              <span>HTML5</span>
              <span>CSS3</span>
              <span>JavaScript</span>
              <span>React.js</span>
              <span>Node.js</span>
              <span>MongoDB</span>
            </div>
          </footer>
        </div>
      );
    }

    // Subcomponent: Analytics
    function AnalyticsSection({ transactions, categories, summary }) {
      const expMap = {};
      let totalExp = 0;
      transactions.forEach(t => {
        if (t.type === 'expense') {
          totalExp += t.amount;
          expMap[t.category] = (expMap[t.category] || 0) + t.amount;
        }
      });

      const breakdown = Object.keys(expMap).map(k => {
        const cat = categories.find(c => c.name === k);
        const val = expMap[k];
        return {
          name: k,
          amount: val,
          percent: totalExp > 0 ? ((val / totalExp) * 100).toFixed(1) : 0,
          color: cat ? cat.color : '#6366f1',
          icon: cat ? cat.icon : '🏷️'
        };
      }).sort((a, b) => b.amount - a.amount);

      let cum = 0;
      const segments = breakdown.map(item => {
        const dash = `${item.percent} ${100 - item.percent}`;
        const offset = -cum;
        cum += parseFloat(item.percent);
        return { ...item, dash, offset };
      });

      const maxVal = Math.max(summary.totalIncome, summary.totalExpense, 1);
      const incH = Math.round((summary.totalIncome / maxVal) * 100);
      const expH = Math.round((summary.totalExpense / maxVal) * 100);

      return (
        <div className="analytics-grid">
          <div className="analytics-card">
            <div className="card-header-chart">
              <div>
                <h3>Expense Breakdown by Category</h3>
                <span className="subtitle">Visual category spending share</span>
              </div>
              <span className="badge-tag">₹{totalExp.toLocaleString('en-IN')}</span>
            </div>
            <div className="donut-and-legend">
              <div className="donut-wrapper">
                <svg viewBox="0 0 42 42" className="donut-chart">
                  <circle cx="21" cy="21" r="15.91549430918954" fill="#fff" />
                  <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#e2e8f0" strokeWidth="4" />
                  {segments.map((s, i) => (
                    <circle key={i} cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke={s.color} strokeWidth="4" strokeDasharray={s.dash} strokeDashoffset={s.offset} />
                  ))}
                </svg>
                <div className="donut-center-text">
                  <span className="donut-center-amount">₹{totalExp.toLocaleString('en-IN')}</span>
                  <span className="donut-center-label">Spent</span>
                </div>
              </div>
              <div className="chart-legend-list">
                {breakdown.slice(0, 5).map(b => (
                  <div key={b.name} className="legend-item">
                    <div className="legend-left">
                      <span className="legend-dot" style={{ backgroundColor: b.color }}></span>
                      <span>{b.icon} {b.name}</span>
                    </div>
                    <div className="legend-right">
                      <strong>₹{b.amount.toLocaleString('en-IN')}</strong>
                      <span className="legend-percent">{b.percent}%</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="analytics-card">
            <div className="card-header-chart">
              <div>
                <h3>Cashflow Comparison</h3>
                <span className="subtitle">Income vs Expenses balance</span>
              </div>
            </div>
            <div className="bar-comparison-container">
              <div className="bar-col">
                <div className="bar-track">
                  <div className="bar-fill bar-fill-income" style={{ height: `${incH}%` }}></div>
                </div>
                <span className="bar-label">Income</span>
                <span className="bar-val text-income">+₹{summary.totalIncome.toLocaleString('en-IN')}</span>
              </div>
              <div className="bar-col">
                <div className="bar-track">
                  <div className="bar-fill bar-fill-expense" style={{ height: `${expH}%` }}></div>
                </div>
                <span className="bar-label">Expenses</span>
                <span className="bar-val text-expense">-₹{summary.totalExpense.toLocaleString('en-IN')}</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Subcomponent: Category Budgets
    function BudgetSection({ categories, transactions }) {
      const budgeted = categories.filter(c => c.type === 'expense' && c.budgetLimit > 0);
      const spentMap = {};
      transactions.forEach(t => {
        if (t.type === 'expense') spentMap[t.category] = (spentMap[t.category] || 0) + t.amount;
      });

      return (
        <div className="budget-container">
          <div className="card-header-chart">
            <div>
              <h3>Category Monthly Budgets</h3>
              <span className="subtitle">Real-time alerts against defined spending limits</span>
            </div>
          </div>
          <div className="budget-cards-grid">
            {budgeted.map(cat => {
              const spent = spentMap[cat.name] || 0;
              const limit = cat.budgetLimit;
              const pct = Math.min(Math.round((spent / limit) * 100), 100);
              const isOver = spent > limit;
              const statusClass = isOver ? 'status-danger' : pct >= 75 ? 'status-warning' : 'status-safe';

              return (
                <div key={cat._id} className="budget-card">
                  <div className="budget-card-header">
                    <div className="budget-title-info">
                      <span className="cat-icon-lg">{cat.icon}</span>
                      <div>
                        <div className="cat-title">{cat.name}</div>
                        <span className="cat-limit-sub">Budget: ₹{limit.toLocaleString('en-IN')}/mo</span>
                      </div>
                    </div>
                    <span className={`budget-percent-badge ${statusClass}`}>
                      {isOver ? `Over by ₹${(spent - limit).toLocaleString('en-IN')}` : `${pct}%`}
                    </span>
                  </div>
                  <div className="progress-bar-bg">
                    <div className="progress-bar-fill" style={{ width: `${pct}%`, backgroundColor: isOver ? '#ef4444' : cat.color }}></div>
                  </div>
                  <div className="budget-card-footer">
                    <span>Spent: <strong>₹{spent.toLocaleString('en-IN')}</strong></span>
                    <span>{isOver ? <strong style={{ color: '#ef4444' }}>Exceeded!</strong> : `Left: ₹${(limit - spent).toLocaleString('en-IN')}`}</span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Subcomponent: Transaction Modal
    function TransactionModal({ onClose, onSubmit, defaultType, categories }) {
      const [type, setType] = useState(defaultType);
      const [title, setTitle] = useState('');
      const [amount, setAmount] = useState('');
      const [category, setCategory] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [paymentMethod, setPaymentMethod] = useState('UPI / Online');
      const [notes, setNotes] = useState('');

      const filtered = categories.filter(c => c.type === type);
      useEffect(() => {
        if (filtered.length > 0) setCategory(filtered[0].name);
      }, [type]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const catObj = categories.find(c => c.name === category);
        onSubmit({
          title,
          amount: parseFloat(amount),
          type,
          category,
          categoryColor: catObj ? catObj.color : '#6366f1',
          date: new Date(date).toISOString(),
          paymentMethod,
          notes
        });
        onClose();
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>{type === 'income' ? '💰 Record New Income' : '💸 Record New Expense'}</h2>
              <button className="modal-close-btn" onClick={onClose}>&times;</button>
            </div>
            <form onSubmit={handleSubmit} className="modal-form">
              <div className="type-toggle-container">
                <button type="button" className={`type-toggle-btn ${type === 'income' ? 'active-income' : ''}`} onClick={() => setType('income')}>+ Income</button>
                <button type="button" className={`type-toggle-btn ${type === 'expense' ? 'active-expense' : ''}`} onClick={() => setType('expense')}>− Expense</button>
              </div>

              <div className="form-group">
                <label>Title / Description *</label>
                <input type="text" placeholder="e.g. Monthly Salary, Grocery store" value={title} onChange={e => setTitle(e.target.value)} required />
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label>Amount (₹) *</label>
                  <input type="number" step="1" min="1" placeholder="0.00" value={amount} onChange={e => setAmount(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>Category *</label>
                  <select value={category} onChange={e => setCategory(e.target.value)}>
                    {filtered.map(c => <option key={c._id} value={c.name}>{c.icon} {c.name}</option>)}
                  </select>
                </div>
              </div>

              <div className="form-row">
                <div className="form-group">
                  <label>Date</label>
                  <input type="date" value={date} onChange={e => setDate(e.target.value)} required />
                </div>
                <div className="form-group">
                  <label>Payment Method</label>
                  <select value={paymentMethod} onChange={e => setPaymentMethod(e.target.value)}>
                    <option value="UPI / Online">UPI / Online</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Debit Card">Debit Card</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                    <option value="Cash">Cash</option>
                  </select>
                </div>
              </div>

              <div className="form-group">
                <label>Notes (Optional)</label>
                <textarea rows="2" placeholder="Details..." value={notes} onChange={e => setNotes(e.target.value)}></textarea>
              </div>

              <div className="modal-actions">
                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                <button type="submit" className={`btn ${type === 'income' ? 'btn-income' : 'btn-expense'}`}>Save</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Subcomponent: Category Modal
    function CategoryModal({ categories, onClose, onAddCategory, onDeleteCategory }) {
      const [name, setName] = useState('');
      const [type, setType] = useState('expense');
      const [color, setColor] = useState('#6366f1');
      const [icon, setIcon] = useState('🏷️');
      const [budgetLimit, setBudgetLimit] = useState('');
      const [activeTab, setActiveTab] = useState('expense');

      const emojiList = ['🏷️', '🛒', '🍔', '🏢', '⚡', '🚗', '🎬', '💊', '🛍️', '💼', '💻', '📈', '🏠', '🎁', '✈️'];

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onAddCategory({
          name: name.trim(),
          type,
          color,
          icon,
          budgetLimit: type === 'expense' ? parseFloat(budgetLimit) || 0 : 0
        });
        setName('');
        setBudgetLimit('');
      };

      const displayed = categories.filter(c => c.type === activeTab);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content modal-lg" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>🏷️ Category & Budget Settings</h2>
              <button className="modal-close-btn" onClick={onClose}>&times;</button>
            </div>
            <div className="category-manager-grid">
              <div>
                <h3 style={{ fontSize: '15px', marginBottom: '12px' }}>Create Category</h3>
                <form onSubmit={handleSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  <div className="type-toggle-container">
                    <button type="button" className={`type-toggle-btn ${type === 'expense' ? 'active-expense' : ''}`} onClick={() => setType('expense')}>Expense</button>
                    <button type="button" className={`type-toggle-btn ${type === 'income' ? 'active-income' : ''}`} onClick={() => setType('income')}>Income</button>
                  </div>
                  <div className="form-group">
                    <label>Category Name *</label>
                    <input type="text" placeholder="e.g. Subscriptions" value={name} onChange={e => setName(e.target.value)} required />
                  </div>
                  <div className="form-row">
                    <div className="form-group">
                      <label>Icon</label>
                      <select value={icon} onChange={e => setIcon(e.target.value)}>
                        {emojiList.map(em => <option key={em} value={em}>{em}</option>)}
                      </select>
                    </div>
                    <div className="form-group">
                      <label>Color</label>
                      <input type="color" value={color} onChange={e => setColor(e.target.value)} style={{ height: '38px', padding: '2px' }} />
                    </div>
                  </div>
                  {type === 'expense' && (
                    <div className="form-group">
                      <label>Monthly Budget Limit (₹)</label>
                      <input type="number" min="0" placeholder="e.g. 5000" value={budgetLimit} onChange={e => setBudgetLimit(e.target.value)} />
                    </div>
                  )}
                  <button type="submit" className="btn btn-primary btn-block">Add Category</button>
                </form>
              </div>

              <div>
                <div style={{ display: 'flex', gap: '8px', marginBottom: '12px' }}>
                  <button className={`filter-btn ${activeTab === 'expense' ? 'active' : ''}`} onClick={() => setActiveTab('expense')}>Expenses</button>
                  <button className={`filter-btn ${activeTab === 'income' ? 'active' : ''}`} onClick={() => setActiveTab('income')}>Income</button>
                </div>
                <div className="category-scroll-list">
                  {displayed.map(c => (
                    <div key={c._id} className="category-item-card">
                      <span className="cat-pill" style={{ backgroundColor: `${c.color}15`, color: c.color, borderColor: `${c.color}40` }}>
                        <span>{c.icon}</span> <span>{c.name}</span>
                      </span>
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        {c.type === 'expense' && c.budgetLimit > 0 && <span className="budget-tag">₹{c.budgetLimit.toLocaleString('en-IN')}/mo</span>}
                        <button className="row-delete-btn" onClick={() => onDeleteCategory(c._id)}>🗑️</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
